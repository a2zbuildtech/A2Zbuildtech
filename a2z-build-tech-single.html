<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A2Z Build Tech</title>
<meta name="description" content="A2Z Build Tech, All Type Manpower Supplier and civil works, Vivek Nagar, Maihar, Madhya Pradesh.">
<meta name="theme-color" content="#c4501b">
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout concept: a drawing-sheet title block up top, then ruled work sheets. One orange accent, used only on the primary action. */
:root{
  --bg:#f2f3f0; --sf:#ffffff; --fg:#14202b; --mu:#566370; --ln:#d3d8d4; --soft:#e7eae6;
  --ac:#c4501b; --acf:#ffffff; --st:#1f4e79; --ok:#1d7a4a; --bad:#b3261e;
  --fd:'Barlow Condensed','Arial Narrow',sans-serif; --fb:'Inter',system-ui,sans-serif; --fm:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161c; --sf:#18212a; --fg:#e8ecef; --mu:#9aa7b2; --ln:#2b3742; --soft:#1e2832;
  --ac:#f0793f; --acf:#1a0d05; --st:#7db4e6; --ok:#5fcf93; --bad:#ff8a80; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#10161c; --sf:#18212a; --fg:#e8ecef; --mu:#9aa7b2; --ln:#2b3742; --soft:#1e2832;
  --ac:#f0793f; --acf:#1a0d05; --st:#7db4e6; --ok:#5fcf93; --bad:#ff8a80; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--fb);min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:30}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--st)}
h1,h2,h3{font-family:var(--fd);text-transform:uppercase;letter-spacing:.03em;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:clamp(34px,7vw,60px);font-weight:700}
h2{font-size:clamp(26px,4.5vw,36px);font-weight:700}
h3{font-size:21px;font-weight:600}
p{margin:0;max-width:65ch}
.hi{font:500 .55em var(--fb);text-transform:none;letter-spacing:0;color:var(--mu);margin-left:8px;white-space:nowrap}
.mu{color:var(--mu)} em{font-style:normal;font-weight:500;color:var(--mu)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sf);border-bottom:1px solid var(--ln)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.mark{font:700 22px var(--fd);background:var(--fg);color:var(--bg);padding:2px 8px;letter-spacing:.04em}
.brand b{display:block;font:700 19px var(--fd);text-transform:uppercase;letter-spacing:.05em;line-height:1}
.brand small{color:var(--mu);font-size:11px}
.nav{display:flex;gap:2px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.nav a{white-space:nowrap;padding:7px 12px;text-decoration:none;color:var(--mu);font-weight:600;font-size:13px;border-bottom:2px solid transparent}
.nav a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--ac)}
.ghost{background:none;border:1px solid var(--ln);color:var(--fg);width:36px;height:36px;border-radius:4px;cursor:pointer;font-size:16px}
main{padding-block:28px 56px;display:grid;gap:44px}
section{display:grid;gap:18px;min-width:0}
.tb{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));border:1.5px solid var(--fg);background:var(--sf)}
.tb>div{padding:10px 14px;border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);min-width:0}
.tb small,.lbl{display:block;font:600 10.5px var(--fb);letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.hero{display:grid;gap:20px}
.hero p{font-size:17px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.btn{background:var(--ac);color:var(--acf);border:0;padding:10px 18px;font:600 14px var(--fb);cursor:pointer;border-radius:4px;text-decoration:none;display:inline-block}
.btn.sec{background:transparent;color:var(--fg);border:1.5px solid var(--fg)}
.link{background:none;border:0;color:var(--st);cursor:pointer;font:600 13px var(--fb);padding:4px}
.link.danger{color:var(--bad)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--st);outline-offset:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}
.card{background:var(--sf);border:1px solid var(--ln);padding:16px;border-radius:4px;min-width:0;display:grid;gap:10px;align-content:start}
.sheet{background:var(--sf);border:1.5px solid var(--fg);padding:18px;display:grid;gap:16px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--sf);color:var(--fg);border:1px solid var(--ln);padding:7px 12px;border-radius:99px;cursor:pointer;font:600 13px var(--fb)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
label{display:grid;gap:4px;font:600 12px var(--fb);color:var(--mu);min-width:0}
input,select,textarea{font:15px var(--fb);padding:9px 10px;border:1px solid var(--ln);background:var(--bg);color:var(--fg);border-radius:4px;min-width:0;width:100%}
textarea{min-height:120px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px;align-items:end}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:600 10.5px var(--fb);letter-spacing:.1em;text-transform:uppercase;color:var(--mu);text-align:left;padding:8px;border-bottom:1.5px solid var(--fg);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--ln);vertical-align:middle}
td input,td select{padding:6px 8px;min-width:90px}
.n{font:500 14px var(--fm);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th.n{font:600 10.5px var(--fb)}
tr.tot td{border-bottom:0;border-top:1.5px solid var(--fg);font-weight:600}
tr.big td{font:700 20px var(--fd);letter-spacing:.03em;text-transform:uppercase}
details{background:var(--sf);border:1px solid var(--ln);border-radius:4px}
summary{cursor:pointer;padding:13px 16px;font:600 20px var(--fd);text-transform:uppercase;letter-spacing:.03em;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--fm)}
details[open] summary::after{content:"–"}
details .in{padding:0 16px 16px;display:grid;gap:10px}
ol,ul{margin:0;padding-left:20px;display:grid;gap:6px}
.pill{font:600 11px var(--fb);padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--mu)}
.note{border-left:3px solid var(--st);padding:8px 12px;background:var(--soft);font-size:13.5px;max-width:75ch}
.warn{border-left-color:var(--bad)}
pre.doc{white-space:pre-wrap;word-break:break-word;font:13.5px/1.6 var(--fm);background:var(--bg);border:1px solid var(--ln);padding:16px;margin:0;max-height:560px;overflow:auto}
.kpi{font:700 30px var(--fd);letter-spacing:.02em}
.msg{color:var(--bad);font-size:13px;min-height:18px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:4px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:calc(100% - 32px)}
#toast.on{opacity:1}
footer{border-top:1px solid var(--ln);background:var(--sf);padding-block:20px;color:var(--mu);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

      run: function (v, rate) {
        var vol = n(v.l) * n(v.b) * n(v.h), g = pick(v.g, Object.keys(MIX), 'M20'), m = MIX[g];
        var dry = vol * DRY_CONCRETE, t = m[0] + m[1] + m[2];
        return [L(rate, 'Concrete volume', vol, 'm³'),
          L(rate, 'Cement', dry * m[0] / t / BAG, 'bag', 'cement', true),
          L(rate, 'Sand', dry * m[1] / t, 'm³', 'sand'),
          L(rate, 'Aggregate', dry * m[2] / t, 'm³', 'agg')];
      } },
    { id: 'brick', n: 'Brickwork', hi: 'ईंट चिनाई', f: [
        { k: 'l', l: 'Wall length', u: 'm', d: 10 }, { k: 'h', l: 'Wall height', u: 'm', d: 3 },
        { k: 't', l: 'Thickness', o: [['0.115', '115 mm'], ['0.23', '230 mm']], d: '0.23' },
        { k: 'o', l: 'Openings (doors, windows)', u: 'm²', d: 4 }, { k: 'r', l: 'Mortar', o: MORT, d: '6' }],
      run: function (v, rate) {
        var area = Math.max(0, n(v.l) * n(v.h) - n(v.o)), t = +pick(v.t, ['0.115', '0.23'], '0.23');
        var vol = area * t, dry = vol * MORTAR_PER_M3 * DRY_MORTAR, r = +pick(v.r, ['4', '5', '6'], '6');
        return [L(rate, 'Net wall area', area, 'm²'), L(rate, 'Brickwork volume', vol, 'm³'),
          L(rate, 'Bricks (with 5% wastage)', vol * BRICKS_PER_M3 * BRICK_WASTAGE, 'nos', 'brick', true),
          L(rate, 'Cement', dry / (1 + r) / BAG, 'bag', 'cement', true),
          L(rate, 'Sand', dry * r / (1 + r), 'm³', 'sand')];
      } },
    { id: 'plaster', n: 'Plaster', hi: 'प्लास्टर', f: [
        { k: 'a', l: 'Plaster area', u: 'm²', d: 60 }, { k: 't', l: 'Thickness', u: 'mm', d: 12 }, { k: 'r', l: 'Mortar', o: MORT, d: '4' }],
      run: function (v, rate) {
        var dry = n(v.a) * Math.min(n(v.t), 200) / 1000 * DRY_MORTAR, r = +pick(v.r, ['4', '5', '6'], '4');
        return [L(rate, 'Plaster area', n(v.a), 'm²'), L(rate, 'Mortar (dry volume)', dry, 'm³'),
          L(rate, 'Cement', dry / (1 + r) / BAG, 'bag', 'cement', true),
          L(rate, 'Sand', dry * r / (1 + r), 'm³', 'sand')];
      } },
    { id: 'steel', n: 'Steel bars', hi: 'सरिया', f: [
        { k: 'd', l: 'Bar diameter', o: BARS.map(function (b) { return [String(b), b + ' mm']; }), d: '12' },
        { k: 'len', l: 'Length of one bar', u: 'm', d: 6 }, { k: 'n', l: 'Number of bars', d: 50 }, { k: 'w', l: 'Wastage', u: '%', d: 5 }],
      run: function (v, rate) {
        var d = +pick(v.d, BARS.map(String), '12'), upm = d * d / 162, tl = n(v.len) * n(v.n);
        return [L(rate, 'Weight per metre', upm, 'kg/m'), L(rate, 'Total length', tl, 'm'),
          L(rate, 'Steel with wastage', upm * tl * (1 + pct(v.w) / 100), 'kg', 'steel')];
      } },
    { id: 'tile', n: 'Tiles', hi: 'टाइल', f: [
        { k: 'l', l: 'Room length', u: 'm', d: 4 }, { k: 'b', l: 'Room width', u: 'm', d: 3.5 },
        { k: 'tl', l: 'Tile length', u: 'mm', d: 600 }, { k: 'tw', l: 'Tile width', u: 'mm', d: 600 }, { k: 'w', l: 'Wastage', u: '%', d: 10 }],
      run: function (v, rate) {
        var a = n(v.l) * n(v.b), ta = Math.max(1, n(v.tl)) * Math.max(1, n(v.tw)) / 1e6, w = 1 + pct(v.w) / 100;
        return [L(rate, 'Floor area', a, 'm²'), L(rate, 'Tile area with wastage', a * SQFT_PER_M2 * w, 'sq ft', 'tile'),
          L(rate, 'Tiles required', a * w / ta, 'nos', null, true)];
      } },
    { id: 'paint', n: 'Paint', hi: 'पेंट', f: [
        { k: 'a', l: 'Wall area', u: 'm²', d: 150 }, { k: 'c', l: 'Coats', d: 2 }, { k: 'cv', l: 'Coverage per coat', u: 'm² per litre', d: 11 }],
      run: function (v, rate) {
        return [L(rate, 'Area', n(v.a), 'm²'), L(rate, 'Paint needed', n(v.a) * n(v.c) / Math.max(1, n(v.cv)), 'litre', 'paint', true)];
      } },
    { id: 'excav', n: 'Excavation', hi: 'खुदाई', f: [
        { k: 'l', l: 'Length', u: 'm', d: 12 }, { k: 'b', l: 'Width', u: 'm', d: 8 }, { k: 'd', l: 'Depth', u: 'm', d: 1.5 }],
      run: function (v, rate) {
        var vol = n(v.l) * n(v.b) * n(v.d);
        return [L(rate, 'Excavated volume', vol, 'm³', 'excav'), L(rate, 'Loose soil after excavation (+25%)', vol * SWELL, 'm³')];
      } }
  ];

  /* material cost + labour and margin */
  function totals(rows, labPct) {
    var mat = 0;
    rows.forEach(function (r) { if (r.amt != null) mat += r.amt; });
    var lab = mat * pct(labPct, 500) / 100;
    return { mat: mat, lab: lab, total: mat + lab };
  }

  /* BOQ: items [{q, r}], P {oh, pr, gst} in percent */
  function boqTotals(items, P) {
    var sub = 0;
    items.forEach(function (i) { sub += n(i.q) * n(i.r); });
    var oh = sub * pct(P.oh) / 100, pr = (sub + oh) * pct(P.pr) / 100, taxable = sub + oh + pr, gst = taxable * pct(P.gst) / 100;
    return { sub: sub, oh: oh, pr: pr, taxable: taxable, gst: gst, total: taxable + gst };
  }

  /* Manpower: rows [{t, n, d, ot}], labour [{id, rate}], P {ot, svc, gst} */
  function mpTotals(rows, labour, P) {
    var wages = 0, ot = 0, md = 0;
    rows.forEach(function (r) {
      var lb = labour.filter(function (x) { return x.id === r.t; })[0], rate = lb ? n(lb.rate) : 0;
      wages += n(r.n) * n(r.d) * rate;
      ot += n(r.n) * n(r.ot) * (rate / 8) * Math.min(n(P.ot), 10);
      md += n(r.n) * n(r.d);
    });
    var svc = (wages + ot) * pct(P.svc, 100) / 100, gst = (wages + ot + svc) * pct(P.gst) / 100, total = wages + ot + svc + gst;
    return { wages: wages, ot: ot, svc: svc, gst: gst, total: total, manDays: md, perManDay: md ? total / md : 0 };
  }

  /* Bill: TDS and retention are taken on the amount before GST */
  function billNet(b) {
    var gross = n(b.g), gst = gross * pct(b.gst) / 100, tds = gross * pct(b.tds) / 100, ret = gross * pct(b.ret) / 100;
    var adv = n(b.adv), oth = n(b.oth), net = gross + gst - tds - ret - adv - oth;
    return { gross: gross, gst: gst, tds: tds, ret: ret, adv: adv, oth: oth, net: net, short: net < 0 };
  }

  /* ---- agreement text ---- */
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function dateText(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso));
    if (!m || +m[2] < 1 || +m[2] > 12 || +m[3] < 1 || +m[3] > 31) return '____________';
    return (+m[3]) + ' ' + MONTHS[+m[2] - 1] + ' ' + m[1];
  }
  function agreementText(v) {
    var blank = '__________________';
    var P = String(v.party || '').trim() || blank, ds = dateText(v.start);
    var type = pick(v.type, ['manpower', 'works', 'sub'], 'manpower');
    var scope = {
      manpower: 'The Contractor shall supply skilled and unskilled workers to the Company at the Site, in the trades and numbers requested by the Company in writing.',
      works: 'The Contractor shall carry out the civil works described in the work order and Bill of Quantities at the Site, with the materials and workmanship specified.',
      sub: 'The Contractor shall carry out the part of the civil works assigned by the Company under its main contract, at the Site, to the specification of that contract.'
    }[type];
    var title = { manpower: 'MANPOWER SUPPLY AGREEMENT', works: 'CIVIL WORKS CONTRACT', sub: 'SUB-CONTRACT AGREEMENT' }[type];
    var months = n(v.months), cycle = n(v.cycle), notice = n(v.notice), adv = pct(v.adv), ret = pct(v.ret);
    var court = String(v.court || '').trim() || blank;
    var t = [
      title, '',
      'This agreement is made on ' + ds + ' between:', '',
      '1. A2Z Build Tech (All Type Manpower Supplier), Vivek Nagar, Ward No. 19, Maihar, Madhya Pradesh - 485771 ("the Contractor"); and',
      '2. ' + P + ', ' + (String(v.addr || '').trim() || blank) + (String(v.gstin || '').trim() ? ', GSTIN ' + String(v.gstin).trim() : '') + ' ("the Company").', '',
      '1. SCOPE OF WORK', scope + ' Site: ' + (String(v.site || '').trim() || blank) + '.', '',
      '2. TERM', 'The agreement starts on ' + ds + ' and runs for ' + months + ' month(s), unless ended earlier under clause 12 or extended in writing.', '',
      '3. RATES', 'Rates are as below and are exclusive of GST.', String(v.rates || '').trim() || blank, '',
      '4. WORKING HOURS AND OVERTIME', 'A normal working day is 8 hours. Work beyond this is paid at ' + Math.min(n(v.otm), 10) + ' times the hourly rate, and must be approved by the Company\'s supervisor.', '',
      '5. ATTENDANCE AND MEASUREMENT', 'Attendance sheets or measurement sheets are signed by the Company\'s representative every day or at every measurement. These sheets are the basis of billing.', '',
      '6. BILLING AND PAYMENT', 'The Contractor raises a bill every fortnight or month. The Company pays within ' + cycle + ' days of receiving the bill with signed sheets.' + (adv > 0 ? ' A mobilisation advance of ' + adv + '% is paid at the start and recovered from running bills.' : ''), '',
      '7. TAXES AND DEDUCTIONS', 'GST at ' + pct(v.gst) + '% is added to each bill. The Company deducts TDS at ' + pct(v.tds) + '% as per law and gives a certificate.' + (ret > 0 ? ' Retention of ' + ret + '% is held from each bill and released after the defect liability period.' : ''), '',
      '8. COMPLIANCE', 'The Contractor pays wages to its workers and meets the labour law, PF and ESI requirements that apply to it. The Company gives site access and the details needed for compliance.', '',
      '9. SAFETY', 'The Contractor provides basic safety gear for its workers. The Company\'s site safety rules apply to everyone on site. Work may be stopped by either side for an unsafe condition.', '',
      '10. MATERIALS AND EQUIPMENT', 'Unless stated otherwise in writing, materials and heavy equipment are supplied by the Company, and hand tools by the Contractor.', '',
      '11. QUALITY AND REPLACEMENT', 'The Contractor corrects defective work at its own cost. The Company may ask for a worker to be replaced, and the Contractor arranges a replacement as soon as possible.', '',
      '12. TERMINATION', 'Either side may end this agreement by giving ' + notice + ' days\' written notice. All dues up to the date of ending are cleared within the payment period.', '',
      '13. NON-SOLICITATION', 'During this agreement and for six months after, the Company shall not directly hire the Contractor\'s workers without the Contractor\'s written consent.', '',
      '14. DISPUTES', 'The parties first try to settle any dispute by discussion. If that fails, the courts at ' + court + ' have jurisdiction.', '',
      'Signed by the Contractor: ____________________    Name: ____________________',
      'Signed by the Company:    ____________________    Name: ____________________',
      'Witness 1: ____________________    Witness 2: ____________________'
    ];
    return t.join('\n');
  }

  return {
    BAG: BAG, MIX: MIX, MORT: MORT, BARS: BARS, CALCS: CALCS,
    n: n, pct: pct, ceilSafe: ceilSafe, esc: esc,
    totals: totals, boqTotals: boqTotals, mpTotals: mpTotals, billNet: billNet,
    agreementText: agreementText, dateText: dateText
  };
});

</script>
<script>
/* A2Z Build Tech - page logic. Calculations live in calc.js, content and storage rules in data.js. */
(function(){
'use strict';
var D=A2ZData,C=A2ZCalc,METHODS=D.METHODS,FORMULAS=D.FORMULAS,TERMS=D.TERMS,CALCS=C.CALCS;
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var noop=function(){};
var esc=C.esc;
function inr(n){return '₹'+(+n||0).toLocaleString('en-IN',{maximumFractionDigits:0})}
function inr2(n){return '₹'+(+n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function nf(n,d){return (+n||0).toLocaleString('en-IN',{maximumFractionDigits:d==null?2:d})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
var toastT;
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},2600)}

/* ---------- data (stored in this browser only) ---------- */
var LS='a2z_build_tech_v1';
var DB=load();
function load(){try{var r=localStorage.getItem(LS);if(r)return D.sanitize(JSON.parse(r))}catch(e){}return D.defaults()}
function save(){try{localStorage.setItem(LS,JSON.stringify(DB))}catch(e){toast('This browser blocked storage, changes will not be kept.')}}
function rateOf(id){var m=DB.mats.filter(function(x){return x.id===id})[0];return m?+m.rate||0:0}

/* ---------- shared form helper ---------- */
function fld(f,v){
  var lab=esc(f.l)+(f.u?' <em>('+esc(f.u)+')</em>':'');
  var val=(v==null||v==='')?(f.d==null?'':f.d):v;
  if(f.o){
    return '<label>'+lab+'<select name="'+f.k+'">'+f.o.map(function(o){o=Array.isArray(o)?o:[o,o];return '<option value="'+esc(o[0])+'"'+(String(o[0])===String(val)?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select></label>';
  }
  if(f.t==='area') return '<label style="grid-column:1/-1">'+lab+'<textarea name="'+f.k+'" maxlength="2000">'+esc(val)+'</textarea></label>';
  var t=f.t||(typeof f.d==='number'?'number':'text');
  var extra=t==='number'?' inputmode="decimal" step="any" min="0"':'';
  return '<label>'+lab+'<input name="'+f.k+'" type="'+t+'"'+extra+(t==='number'?'':' maxlength="300"')+(f.r?' required':'')+' value="'+esc(val)+'"></label>';
}

var calcId='concrete',calcVals={},labPct=30;
function readCalc(c){
  var root=$('#calcBox'),v={};
  c.f.forEach(function(f){var el=root.querySelector('[name="'+f.k+'"]');v[f.k]=f.o?el.value:C.n(el.value)});
  var lp=root.querySelector('[name="_lab"]');labPct=C.n(lp.value);
  calcVals[c.id]=v;return v;
}
function drawCalc(){
  var c=CALCS.filter(function(x){return x.id===calcId})[0], sv=calcVals[c.id]||{};
  $('#calcBox').innerHTML='<h3>'+esc(c.n)+'<span class="hi">'+esc(c.hi)+'</span></h3><div class="grid">'+
    c.f.map(function(f){return fld(f,sv[f.k])}).join('')+
    '<label>Labour and margin on materials <em>(%)</em><input name="_lab" type="number" inputmode="decimal" min="0" value="'+labPct+'"></label></div><div class="scroll" id="calcOut"></div>';
  calcOut();
}
function calcOut(){
  var c=CALCS.filter(function(x){return x.id===calcId})[0],v=readCalc(c),rows=c.run(v,rateOf);
  var tt=C.totals(rows,labPct),mat=tt.mat,lab=tt.lab;
  $('#calcOut').innerHTML='<table><thead><tr><th>Item</th><th class="n">Quantity</th><th>Unit</th><th class="n">Rate</th><th class="n">Amount</th></tr></thead><tbody>'+
   rows.map(function(r){return '<tr><td>'+esc(r.label)+'</td><td class="n">'+nf(r.qty)+'</td><td>'+esc(r.unit)+'</td><td class="n">'+(r.rate!=null?inr(r.rate):'–')+'</td><td class="n">'+(r.amt!=null?inr(r.amt):'–')+'</td></tr>'}).join('')+
   '<tr class="tot"><td colspan="4">Material cost</td><td class="n">'+inr(mat)+'</td></tr>'+
   '<tr><td colspan="4">Labour and margin ('+nf(labPct,1)+'%)</td><td class="n">'+inr(lab)+'</td></tr>'+
   '<tr class="big"><td colspan="4">Estimated total</td><td class="n">'+inr(mat+lab)+'</td></tr></tbody></table>';
}

/* BOQ */
var boq=[{d:'Excavation in ordinary soil',u:'m³',q:40,r:180},{d:'PCC 1:4:8 below footings',u:'m³',q:6,r:5200},{d:'Brickwork 230 mm in 1:6 mortar',u:'m³',q:25,r:6800}];
var boqP={oh:10,pr:10,gst:18};
function syncBoq(){
  var rows=$$('#boqRows tr');
  if(rows.length||$('#boqRows')){boq=rows.map(function(tr){var g=function(n){return tr.querySelector('[name="'+n+'"]').value};return {d:g('d'),u:g('u'),q:C.n(g('q')),r:C.n(g('r'))}})}
  ['oh','pr','gst'].forEach(function(k){var el=$('#boqP [name="'+k+'"]');if(el)boqP[k]=C.n(el.value)});
}
function drawBoq(){
  $('#boqBox').innerHTML='<div class="scroll"><table><thead><tr><th>Description of work</th><th>Unit</th><th class="n">Quantity</th><th class="n">Rate (₹)</th><th class="n">Amount</th><th></th></tr></thead><tbody id="boqRows">'+
   boq.map(function(r,i){return '<tr><td><input name="d" type="text" style="min-width:220px" value="'+esc(r.d)+'"></td><td><input name="u" type="text" style="min-width:60px;width:70px" value="'+esc(r.u)+'"></td><td><input name="q" type="number" step="any" min="0" value="'+r.q+'"></td><td><input name="r" type="number" step="any" min="0" value="'+r.r+'"></td><td class="n" data-amt>'+inr(r.q*r.r)+'</td><td><button class="link danger" data-act="boqdel" data-i="'+i+'">Remove</button></td></tr>'}).join('')+
   '</tbody></table></div><div class="row"><button class="btn sec" data-act="boqadd">Add item</button></div>'+
   '<div class="grid" id="boqP"><label>Overhead <em>(%)</em><input name="oh" type="number" step="any" min="0" value="'+boqP.oh+'"></label><label>Profit <em>(%)</em><input name="pr" type="number" step="any" min="0" value="'+boqP.pr+'"></label><label>GST <em>(%)</em><input name="gst" type="number" step="any" min="0" value="'+boqP.gst+'"></label></div><div class="scroll" id="boqOut"></div>';
  boqOut();
}
function boqOut(){
  syncBoq();
  $$('#boqRows tr').forEach(function(tr,i){var c=tr.querySelector('[data-amt]');if(c)c.textContent=inr(boq[i].q*boq[i].r)});
  var bt=C.boqTotals(boq,boqP),sub=bt.sub,oh=bt.oh,pr=bt.pr,tx=bt.taxable,g=bt.gst;
  $('#boqOut').innerHTML='<table><tbody><tr><td>Work value</td><td class="n">'+inr2(sub)+'</td></tr><tr><td>Overhead</td><td class="n">'+inr2(oh)+'</td></tr><tr><td>Profit</td><td class="n">'+inr2(pr)+'</td></tr><tr class="tot"><td>Taxable amount</td><td class="n">'+inr2(tx)+'</td></tr><tr><td>GST</td><td class="n">'+inr2(g)+'</td></tr><tr class="big"><td>Total quote</td><td class="n">'+inr2(tx+g)+'</td></tr></tbody></table>';
}

/* Manpower estimator */
var mp=[{t:'mason',n:2,d:26,ot:0},{t:'helper',n:4,d:26,ot:0}];
var mpP={ot:2,svc:10,gst:18};
function trades(){return DB.labour.map(function(x){return [x.id,x.name]})}
function syncMp(){
  if($('#mpRows')){mp=$$('#mpRows tr').map(function(tr){var g=function(n){return tr.querySelector('[name="'+n+'"]').value};return {t:g('t'),n:C.n(g('n')),d:C.n(g('d')),ot:C.n(g('ot'))}})}
  ['ot','svc','gst'].forEach(function(k){var el=$('#mpP [name="'+k+'"]');if(el)mpP[k]=C.n(el.value)});
}
function drawMp(){
  mp.forEach(function(r){if(!DB.labour.some(function(x){return x.id===r.t})&&DB.labour[0])r.t=DB.labour[0].id});
  $('#mpBox').innerHTML='<div class="scroll"><table><thead><tr><th>Trade</th><th class="n">Workers</th><th class="n">Days</th><th class="n">OT hours each</th></tr></thead><tbody id="mpRows">'+
   mp.map(function(r,i){return '<tr><td><select name="t">'+trades().map(function(o){return '<option value="'+esc(o[0])+'"'+(o[0]===r.t?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select></td><td><input name="n" type="number" min="0" step="1" value="'+r.n+'"></td><td><input name="d" type="number" min="0" step="any" value="'+r.d+'"></td><td><input name="ot" type="number" min="0" step="any" value="'+r.ot+'"></td><td><button class="link danger" data-act="mpdel" data-i="'+i+'">Remove</button></td></tr>'}).join('')+
   '</tbody></table></div><div class="row"><button class="btn sec" data-act="mpadd">Add trade</button></div>'+
   '<div class="grid" id="mpP"><label>Overtime multiple <em>(× hourly rate)</em><input name="ot" type="number" step="any" min="0" value="'+mpP.ot+'"></label><label>Service charge <em>(%)</em><input name="svc" type="number" step="any" min="0" value="'+mpP.svc+'"></label><label>GST <em>(%)</em><input name="gst" type="number" step="any" min="0" value="'+mpP.gst+'"></label></div><div class="scroll" id="mpOut"></div>';
  mpOut();
}
function mpOut(){
  syncMp();
  var m=C.mpTotals(mp,DB.labour,mpP),wages=m.wages,ot=m.ot,md=m.manDays,sv=m.svc,g=m.gst,tot=m.total;
  $('#mpOut').innerHTML='<table><tbody><tr><td>Wages</td><td class="n">'+inr2(wages)+'</td></tr><tr><td>Overtime</td><td class="n">'+inr2(ot)+'</td></tr><tr><td>Service charge</td><td class="n">'+inr2(sv)+'</td></tr><tr><td>GST</td><td class="n">'+inr2(g)+'</td></tr><tr class="big"><td>Total for the period</td><td class="n">'+inr2(tot)+'</td></tr><tr><td>Per man-day, all in ('+nf(md,1)+' man-days)</td><td class="n">'+(md?inr2(tot/md):'–')+'</td></tr></tbody></table>';
}

/* ---------- public views ---------- */

function fieldsFor(key){return FIELDS[key].map(function(f){if(f.k==='trade'){return {k:'trade',l:'Trade',o:DB.labour.map(function(x){return x.name})}}return f})}
function crud(key,title){
  var fs=fieldsFor(key);
  return '<h3>'+title+'</h3><form class="grid" data-form="add" data-k="'+key+'">'+fs.map(function(f){return fld(f)}).join('')+'<div><button class="btn" type="submit">Add</button></div></form>'+
  '<div class="scroll"><table><thead><tr>'+fs.map(function(f){return '<th>'+esc(f.l)+'</th>'}).join('')+'<th></th></tr></thead><tbody>'+
  (DB[key].map(function(r){return '<tr>'+fs.map(function(f){return '<td'+(f.m?' class="n"':'')+'>'+(f.m?inr(r[f.k]):esc(r[f.k]))+'</td>'}).join('')+'<td><button class="link danger" data-act="del" data-k="'+key+'" data-id="'+r.id+'">Delete</button></td></tr>'}).join('')||'<tr><td colspan="'+(fs.length+1)+'" class="mu">Nothing added yet.</td></tr>')+'</tbody></table></div>';
}
function sha(s){
  if(!window.crypto||!crypto.subtle)return Promise.reject(new Error('nocrypto'));
  return crypto.subtle.digest('SHA-256',new TextEncoder().encode('a2z|'+s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return x.toString(16).padStart(2,'0')}).join('')});
}
function loginView(){
  var s=DB.settings,setup=!s.hash;
  return '<section style="max-width:460px">'+head(setup?'Create admin account':'Admin login','एडमिन')+
  '<form class="sheet" data-form="'+(setup?'setup':'login')+'">'+
  (setup?'<div class="note">No account exists on this device yet. Choose a username and a password of at least 8 characters.</div>':'')+
  '<label>Username<input name="u" type="text" autocomplete="username" required></label>'+
  '<label>Password<input name="p" type="password" autocomplete="'+(setup?'new-password':'current-password')+'" required></label>'+
  (setup?'<label>Confirm password<input name="p2" type="password" autocomplete="new-password" required></label>':'')+
  '<div class="msg" id="loginMsg" role="alert"></div><div><button class="btn" type="submit">'+(setup?'Create account':'Log in')+'</button></div></form></section>';
}
FORMS.setup=function(f,fd){
  var u=String(fd.get('u')).trim(),p=String(fd.get('p')),p2=String(fd.get('p2')),m=$('#loginMsg');
  if(p.length<8){m.textContent='Password needs at least 8 characters.';return}
  if(p!==p2){m.textContent='The two passwords do not match.';return}
  sha(u.toLowerCase()+p).then(function(h){DB.settings.user=u;DB.settings.hash=h;save();AUTH=true;tab='dash';startIdle();render();toast('Admin account created')}).catch(function(){m.textContent='This browser cannot create a login (secure context needed).'});
};
FORMS.login=function(f,fd){
  var s=DB.settings,m=$('#loginMsg'),now=Date.now();
  if(s.lockUntil>now){m.textContent='Too many attempts. Try again in '+Math.ceil((s.lockUntil-now)/1000)+' seconds.';return}
  var u=String(fd.get('u')).trim(),p=String(fd.get('p'));
  sha(u.toLowerCase()+p).then(function(h){
    if(u.toLowerCase()===String(s.user).toLowerCase()&&h===s.hash){s.fails=0;s.lockUntil=0;save();AUTH=true;tab='dash';startIdle();render()}
    else{s.fails=(s.fails||0)+1;if(s.fails>=5){s.lockUntil=Date.now()+60000;s.fails=0}save();m.textContent='Wrong username or password.'}
  }).catch(function(){m.textContent='This browser cannot check logins (secure context needed).'});
};
function startIdle(){clearTimeout(idleT);if(!AUTH)return;idleT=setTimeout(function(){doLogout(true)},15*60*1000)}
function doLogout(auto){AUTH=false;clearTimeout(idleT);render();toast(auto?'Logged out after 15 minutes idle':'Logged out')}
['click','keydown','input'].forEach(function(ev){document.addEventListener(ev,function(){if(AUTH)startIdle()})});

FORMS.pw=function(f,fd){
  var s=DB.settings,m=$('#pwMsg'),np=String(fd.get('np'));
  if(np.length<8){m.textContent='New password needs at least 8 characters.';return}
  sha(s.user.toLowerCase()+String(fd.get('cur'))).then(function(h){
    if(h!==s.hash){m.textContent='Current password is wrong.';return}
    return sha(s.user.toLowerCase()+np).then(function(n){s.hash=n;save();f.reset();m.textContent='';toast('Password changed')});
  }).catch(function(){m.textContent='This browser cannot change the password.'});
};
FORMS.restore=function(f,fd){
  try{
    var o=JSON.parse(String(fd.get('b')));
    if(!o||typeof o!=='object'||!Array.isArray(o.mats)||!Array.isArray(o.labour))throw new Error('bad');
    var clean=D.sanitize(o);
    ['mats','labour','workers','projects','ledger','enquiries'].forEach(function(k){DB[k]=clean[k]});
    save();render();toast('Backup restored');
  }catch(e){toast('That text is not a valid backup')}
};
FORMS.add=function(f,fd){
  var key=f.dataset.k,o={id:uid()};
  fieldsFor(key).forEach(function(x){var v=fd.get(x.k);o[x.k]=x.t==='number'?D.num(v):String(v==null?'':v).slice(0,300)});
  DB[key].unshift(o);save();render();
};

LIVE.calc=function(){calcOut()};
LIVE.boq=function(){boqOut()};
LIVE.mp=function(){mpOut()};

/* ---------- actions ---------- */
ACTS.calc=function(b){calcId=b.dataset.id;$$('#calcTabs .chip').forEach(function(c){c.setAttribute('aria-pressed',c.dataset.id===calcId)});drawCalc()};
ACTS.boqadd=function(){syncBoq();boq.push({d:'',u:'',q:0,r:0});drawBoq()};
ACTS.boqdel=function(b){syncBoq();boq.splice(+b.dataset.i,1);drawBoq()};
ACTS.mpadd=function(){syncMp();mp.push({t:DB.labour[0]?DB.labour[0].id:'',n:1,d:26,ot:0});drawMp()};
ACTS.mpdel=function(b){syncMp();mp.splice(+b.dataset.i,1);drawMp()};
ACTS.logout=function(){doLogout(false)};
ACTS.tab=function(b){tab=b.dataset.id;render()};
ACTS.addrate=function(b){var l=b.dataset.l;DB[l].push(l==='mats'?{id:uid(),name:'New material',unit:'nos',rate:0}:{id:uid(),name:'New trade',rate:0});save();render()};
var armed=null,armT;
ACTS.del=function(b){
  if(armed!==b){if(armed){armed.textContent='Delete'}armed=b;b.textContent='Sure?';clearTimeout(armT);armT=setTimeout(function(){if(armed===b){b.textContent='Delete';armed=null}},3000);return}
  var k=b.dataset.k,id=b.dataset.id;DB[k]=DB[k].filter(function(r){return r.id!==id});save();armed=null;render();
};
ACTS.copy=function(b){
  var el=$(b.dataset.t),text=el.value!=null&&el.tagName==='TEXTAREA'?el.value:el.textContent;
  function fallback(){var r=document.createRange();r.selectNodeContents(el);var s=window.getSelection();s.removeAllRanges();s.addRange(r);toast('Text selected, now use your device Copy option')}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast('Copied')},fallback)}else fallback();
};

document.addEventListener('submit',function(e){var f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();var fn=FORMS[f.dataset.form];if(fn)fn(f,new FormData(f))});
document.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b)return;var fn=ACTS[b.dataset.act];if(fn)fn(b,e)});
document.addEventListener('input',function(e){var w=e.target.closest('[data-live]');if(w&&LIVE[w.dataset.live])LIVE[w.dataset.live](w,e.target)});

/* ---------- router ---------- */
var ROUTES=[['home','Home'],['methods','Services and methods'],['calculators','Calculators'],['manpower','Manpower'],['formulas','Formulas'],['terms','Terms'],['contact','Contact'],['admin','Admin']];
function current(){var r=(location.hash||'#home').slice(1);return V[r]?r:'home'}
function render(){
  var r=current();
  $('#nav').innerHTML=ROUTES.map(function(x){return '<a href="#'+x[0]+'"'+(x[0]===r?' aria-current="page"':'')+'>'+(x[0]==='admin'&&!AUTH?'Admin login':x[1])+'</a>'}).join('');
  $('#app').innerHTML=V[r]();
  (B[r]||noop)();
  document.title='A2Z Build Tech';
}
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0)});
$('#themeBtn').addEventListener('click',function(){
  var root=document.documentElement,dark=root.getAttribute('data-theme')==='dark'||(!root.getAttribute('data-theme')&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  root.setAttribute('data-theme',dark?'light':'dark');
});
render();
})();

</script>
